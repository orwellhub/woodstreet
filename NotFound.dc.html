<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong turning — Wood Street Indoor Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Archivo+Narrow:wght@500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EBD9;color:#29231C;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7C2A1D}a:hover{color:#BF3B26}
:focus-visible{outline:3px solid #BF3B26;outline-offset:2px}
::selection{background:#DCA528;color:#29231C}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</helmet>
<dc-import name="Header" active="" hint-size="100%,120px"></dc-import>
<main id="main" data-screen-label="404">
  <section style="padding:80px 24px 100px;text-align:center">
    <div style="max-width:640px;margin:0 auto">
      <div style="display:inline-block;position:relative;background:#FBF5E7;border:2px solid #29231C;border-radius:14px;padding:36px 44px;box-shadow:6px 6px 0 rgba(41,35,28,.85);transform:rotate(-1.5deg)">
        <span style="position:absolute;top:-14px;left:24px;background:#DCA528;border:2px solid #29231C;border-radius:999px;padding:5px 13px;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.1em;transform:rotate(2deg);box-shadow:2px 2px 0 #29231C">ADMIT NOBODY</span>
        <p style="font-family:'Young Serif',serif;font-size:clamp(64px,10vw,110px);line-height:1;margin:0;color:#7C2A1D">404</p>
        <p style="font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;margin:8px 0 0;color:#5C5142">Wrong turning</p>
      </div>
      <p style="font-size:17px;line-height:1.65;color:#3E362B;margin:34px auto 8px;max-width:44ch">Even a horseshoe has its dead ends — and this page isn’t on the corridor.</p>
      <p style="font-size:15px;color:#8A7B5E;margin:0 0 30px">The good stuff is this way ↓</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <a href="Home.dc.html" style="display:inline-block;background:#BF3B26;color:#FBF3E2;border:2px solid #29231C;border-radius:10px;padding:13px 20px;font-weight:700;font-size:15px;text-decoration:none;box-shadow:4px 4px 0 #29231C;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-2px,-2px);box-shadow:6px 6px 0 #29231C;color:#FBF3E2">Back to the front door</a>
        <a href="Traders.dc.html" style="display:inline-block;background:#F8F1E1;color:#29231C;border:2px solid #29231C;border-radius:10px;padding:13px 20px;font-weight:700;font-size:15px;text-decoration:none;box-shadow:4px 4px 0 #29231C;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-2px,-2px);box-shadow:6px 6px 0 #29231C;color:#29231C">Explore the Traders</a>
        <a href="Map.dc.html" style="display:inline-block;background:#F8F1E1;color:#29231C;border:2px solid #29231C;border-radius:10px;padding:13px 20px;font-weight:700;font-size:15px;text-decoration:none;box-shadow:4px 4px 0 #29231C;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-2px,-2px);box-shadow:6px 6px 0 #29231C;color:#29231C">Consult the map</a>
      </div>
    </div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,460px"></dc-import>
</x-dc>
</body>
</html>
