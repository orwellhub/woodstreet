<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Archivo+Narrow:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EBD9;font-family:'Archivo',sans-serif}
@keyframes wsm-antsY{to{background-position:0 -36px}}
@keyframes wsm-antsX{to{background-position:-36px 0}}
@keyframes wsm-hlpulse{0%,100%{box-shadow:0 0 0 4px rgba(191,59,38,.38)}50%{box-shadow:0 0 0 9px rgba(191,59,38,.14)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</helmet>
<div aria-label="Illustrated map of the market horseshoe" role="img" style="position:relative;width:100%;aspect-ratio:980/764;background:#FBF5E7;border:2px solid #29231C;border-radius:12px;overflow:hidden;box-shadow:5px 5px 0 rgba(41,35,28,.85)">
  <sc-for list="{{ corridors }}" as="c" hint-placeholder-count="4">
    <div style="position:absolute;left:{{ c.l }};top:{{ c.t }};width:{{ c.w }};height:{{ c.h }};background:#F2E7D0"></div>
  </sc-for>
  <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="4">
    <div style="position:absolute;left:{{ ln.l }};top:{{ ln.t }};width:{{ ln.w }};height:{{ ln.h }};background-image:{{ ln.bg }};animation:{{ ln.anim }};opacity:.75"></div>
  </sc-for>
  <sc-for list="{{ units }}" as="u" hint-placeholder-count="30">
    <div style="position:absolute;left:{{ u.l }};top:{{ u.t }};width:{{ u.w }};height:{{ u.h }};background:{{ u.fill }};border:{{ u.border }};border-radius:3px;animation:{{ u.anim }}">
      <sc-if value="{{ u.hl }}" hint-placeholder-val="{{ false }}">
        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FBF3E2;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px">{{ u.n }}</span>
      </sc-if>
    </div>
  </sc-for>
  <div style="position:absolute;left:45.7%;top:calc(100% - 9px);width:8.6%;height:9px;background:#DCA528;border:2px solid #29231C;border-bottom:none"></div>
  <div style="position:absolute;left:0;top:13%;width:7px;height:5.5%;background:#DCA528;border:2px solid #29231C;border-left:none"></div>
  <span style="position:absolute;left:50%;transform:translateX(-50%);bottom:3.2%;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;color:#95855E">↓ WOOD STREET</span>
  <span style="position:absolute;left:40%;top:56%;font-family:'Archivo Narrow',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.12em;color:#B3A382">STORES</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:450},&quot;highlight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ready: false };
  componentDidMount() { import('./data.js').then((m) => { this.m = m; this.setState({ ready: true }); }); }
  renderVals() {
    const m = this.m;
    if (!m) return { ready: false, units: [], corridors: [], lines: [] };
    const hl = String(this.props.highlight ?? '').split(',').map((s) => parseInt(s.trim(), 10)).filter(Boolean);
    const PX = (v) => (v / m.MAP_W * 100).toFixed(2) + '%';
    const PY = (v) => (v / m.MAP_H * 100).toFixed(2) + '%';
    const corridors = m.CORRIDOR.map((c) => ({ l: PX(c.x), t: PY(c.y), w: PX(c.w), h: PY(c.h) }));
    const gY = 'repeating-linear-gradient(180deg,#C7B189 0 8px,transparent 8px 18px)';
    const gX = 'repeating-linear-gradient(90deg,#C7B189 0 8px,transparent 8px 18px)';
    const lines = [
      { l: PX(223), t: PY(224), w: '2px', h: PY(436), bg: gY, anim: 'wsm-antsY 2.8s linear infinite' },
      { l: PX(224), t: PY(222), w: PX(532), h: '2px', bg: gX, anim: 'wsm-antsX 2.8s linear infinite' },
      { l: PX(755), t: PY(224), w: '2px', h: PY(436), bg: gY, anim: 'wsm-antsY 2.8s linear infinite' },
      { l: PX(224), t: PY(657), w: PX(532), h: '2px', bg: gX, anim: 'wsm-antsX 2.8s linear infinite' },
    ];
    const units = m.UNIT_GEO.map((g) => {
      const t = m.traderByUnit(g.n);
      const avail = m.AVAILABLE_UNITS.includes(g.n);
      const isHl = hl.includes(g.n);
      const cat = t ? m.catById(t.cat) : null;
      return {
        n: g.n, l: PX(g.x), t: PY(g.y), w: PX(g.w), h: PY(g.h),
        fill: isHl ? '#BF3B26' : (avail ? '#F6EDDA' : (cat ? cat.tint : '#E8DEC6')),
        border: isHl ? '2px solid #29231C' : (avail ? '2px dashed #C4684E' : '1.5px solid rgba(41,35,28,.3)'),
        anim: isHl ? 'wsm-hlpulse 2s ease-in-out infinite' : 'none',
        hl: isHl,
      };
    });
    return { ready: true, units, corridors, lines };
  }
}
</script>
</body>
</html>
