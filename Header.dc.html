<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Archivo+Narrow:wght@500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EBD9;color:#29231C;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7C2A1D}a:hover{color:#BF3B26}
:focus-visible{outline:3px solid #BF3B26;outline-offset:2px}
::selection{background:#DCA528;color:#29231C}
@keyframes wsm-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</helmet>
<a href="#main" style="position:absolute;left:-9999px;top:0;z-index:200;background:#29231C;color:#F4EBD9;padding:10px 16px;font-weight:700;text-decoration:none;border-radius:0 0 8px 0" style-focus="left:0">Skip to content</a>
<div style="background:#7C2A1D;color:#F3E7CE;font-size:13px;padding:6px 20px">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:space-between">
    <span style="font-weight:600">Open Tuesday–Saturday, 10.00–5.30 · Closed Sun &amp; Mon</span>
    <span>98 &amp; 102 Wood Street, Walthamstow E17 · 020 8521 0410</span>
  </div>
</div>
<header style="position:sticky;top:0;z-index:90;background:#F8F1E1;border-bottom:2px solid #29231C">
  <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px">
    <a href="Home.dc.html" aria-label="Wood Street Indoor Market — home" style="text-decoration:none;display:flex;flex-direction:column;line-height:1.05;flex:0 0 auto">
      <span style="font-family:'Young Serif',serif;font-size:21px;color:#7C2A1D;letter-spacing:.01em">WOOD STREET</span>
      <span style="font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.28em;color:#17605B;margin-top:2px">INDOOR MARKET · EST. 1955</span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;align-items:center;gap:2px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
          <a href="{{ it.href }}" style="text-decoration:none;color:#29231C;font-weight:600;font-size:14.5px;padding:8px 9px;border-bottom:3px solid {{ it.bb }};white-space:nowrap" style-hover="color:#BF3B26">{{ it.label }}</a>
        </sc-for>
      </nav>
      <a href="Visit.dc.html" title="{{ statusDetail }}" style="display:flex;align-items:center;gap:7px;border:1.5px solid #29231C;border-radius:999px;padding:6px 12px;background:#F4EBD9;text-decoration:none;color:#29231C;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto">
        <span aria-hidden="true" style="width:9px;height:9px;border-radius:99px;background:{{ dot }};animation:wsm-pulse 2.4s ease-in-out infinite;flex:0 0 auto"></span>
        <span>{{ statusLabel }}</span>
      </a>
      <a href="Traders.dc.html" onClick="{{ exploreClick }}" style="background:#BF3B26;color:#FBF3E2;border:2px solid #29231C;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:3px 3px 0 #29231C;white-space:nowrap;flex:0 0 auto;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-1px,-1px);box-shadow:4px 4px 0 #29231C;color:#FBF3E2">Explore the Traders</a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
        <a href="Visit.dc.html" title="{{ statusDetail }}" style="display:flex;align-items:center;gap:6px;border:1.5px solid #29231C;border-radius:999px;padding:6px 11px;background:#F4EBD9;text-decoration:none;color:#29231C;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap">
          <span aria-hidden="true" style="width:8px;height:8px;border-radius:99px;background:{{ dot }};animation:wsm-pulse 2.4s ease-in-out infinite"></span>
          <span>{{ statusLabel }}</span>
        </a>
        <button type="button" onClick="{{ toggle }}" aria-expanded="{{ menuOpenStr }}" aria-label="Menu" style="width:44px;height:44px;border:2px solid #29231C;border-radius:10px;background:#F4EBD9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:2px 2px 0 #29231C">
          <span style="width:18px;height:2px;background:#29231C;display:block"></span>
          <span style="width:18px;height:2px;background:#29231C;display:block"></span>
          <span style="width:18px;height:2px;background:#29231C;display:block"></span>
        </button>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Main menu" style="border-top:2px solid #29231C;background:#F8F1E1;display:flex;flex-direction:column;padding:6px 20px 18px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
        <a href="{{ it.href }}" onClick="{{ close }}" style="text-decoration:none;color:#29231C;font-weight:600;font-size:17px;padding:13px 4px;border-bottom:1px solid #DCCEB0">{{ it.label }}</a>
      </sc-for>
      <a href="Traders.dc.html" onClick="{{ exploreClick }}" style="background:#BF3B26;color:#FBF3E2;border:2px solid #29231C;border-radius:10px;padding:13px 14px;font-weight:700;font-size:15px;text-decoration:none;box-shadow:3px 3px 0 #29231C;text-align:center;margin-top:16px">Explore the Traders</a>
      <span style="margin-top:12px;font-size:13.5px;font-weight:600;color:#5C5142">{{ statusDetail }}</span>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:150},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;traders&quot;,&quot;map&quot;,&quot;whatson&quot;,&quot;visit&quot;,&quot;story&quot;,&quot;journal&quot;,&quot;join&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, mobile: false, status: { open: false, label: '·', detail: '' } };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 1020px)');
    this.onMq = () => this.setState({ mobile: this.mq.matches, menuOpen: false });
    this.onMq();
    this.mq.addEventListener('change', this.onMq);
    import('./data.js').then((m) => {
      this.m = m;
      const up = () => this.setState({ status: m.openStatus() });
      up();
      this.t = setInterval(up, 60000);
    });
  }
  componentWillUnmount() { clearInterval(this.t); if (this.mq) this.mq.removeEventListener('change', this.onMq); }
  renderVals() {
    const active = this.props.active || '';
    const items = [
      ['Traders', 'Traders.dc.html', 'traders'], ['Market Map', 'Map.dc.html', 'map'],
      ["What's On", 'WhatsOn.dc.html', 'whatson'], ['Visit', 'Visit.dc.html', 'visit'],
      ['Our Story', 'Story.dc.html', 'story'], ['Journal', 'Journal.dc.html', 'journal'],
      ['Join the Market', 'Join.dc.html', 'join'],
    ].map(([label, href, key]) => ({ label, href, bb: key === active ? '#BF3B26' : 'transparent' }));
    const s = this.state.status;
    return {
      items,
      mobile: this.state.mobile,
      desktop: !this.state.mobile,
      menuOpen: this.state.menuOpen && this.state.mobile,
      menuOpenStr: this.state.menuOpen ? 'true' : 'false',
      statusLabel: s.label, statusDetail: s.detail,
      dot: s.open ? '#2E7D3C' : '#BF3B26',
      toggle: () => this.setState((x) => ({ menuOpen: !x.menuOpen })),
      close: () => this.setState({ menuOpen: false }),
      exploreClick: () => { if (this.m) this.m.track('explore_traders_click', { placement: 'header' }); },
    };
  }
}
</script>
</body>
</html>
